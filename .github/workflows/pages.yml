name: Deploy research site
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh data and rebuild site]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: pip install pandas numpy requests beautifulsoup4 lxml jinja2 python-dotenv pyyaml tenacity statsmodels
      - name: Test and rebuild
        run: |
          python -m unittest discover -s tests -v
          python run_all.py --check
          python -m src.build.research_suite --public-only
          python -m src.site.build_site
          python -m src.site.validate_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
